apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: iot-node
spec:
  serviceName: "iot"
  replicas: 5
  selector:
    matchLabels:
      app: iot
  template:
    metadata:
      labels:
        app: iot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: node
        image: us-central1-docker.pkg.dev/bits-dissertation-464410/gcp-docker-repo/decentral:latest
        ports:
        - containerPort: 8000
        env:
        - name: PEERS
          valueFrom:
            configMapKeyRef:
              name: peer-config
              key: PEERS
        - name: FEATURE_FLAGS_FILE
          value: "/etc/feature-flags/flags-$(POD_INDEX).json"
        - name: POD_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: feature-flags
          mountPath: /etc/feature-flags
          readOnly: true
      volumes:
      - name: feature-flags
        configMap:
          name: iot-feature-flags
---
apiVersion: v1
kind: Service
metadata:
  name: iot-node-0
  annotations:
    cloud.google.com/load-balancer-type: "Internal"
    cloud.google.com/neg: '{"exposed_ports":{"8000":{}}}'  # Create NEG for port 8000
  labels:
    app: iot
spec:
  type: LoadBalancer
  loadBalancerIP: 10.10.0.10
  selector:
    statefulset.kubernetes.io/pod-name: iot-node-0
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
